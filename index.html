<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Z'Amours</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app">

  <!-- SCREEN 00a — SPLASH -->
  <section class="screen active" id="screen-splash">
    <img class="logo" src="/public/images/zamours-logo.png" alt="Les Z'Amours">
    <button class="btn-large" id="btn-splash">DÉMARRER</button>
    <button class="btn-small" id="btn-resume" style="display:none; margin-top:24px; opacity:0.85">↩ REPRENDRE LA PARTIE</button>
  </section>

  <!-- SCREEN 00b — GÉNÉRIQUE -->
  <section class="screen" id="screen-generique">
    <video id="generique-video" src="/public/videos/zamours-generique.mp4" playsinline></video>
    <div id="generique-btn-wrap">
      <button class="btn-large" id="btn-generique">COMMENCER</button>
    </div>
    <button class="btn-large" id="generique-fallback-btn">▶ LANCER LA VIDÉO</button>
  </section>

  <!-- RULES SCREEN (dynamic) -->
  <section class="screen" id="screen-rules">
    <p class="rules-minor" id="rules-minor"></p>
    <h1 class="rules-major" id="rules-major"></h1>
    <button class="btn-large" id="btn-rules"></button>
  </section>

  <!-- TEMPLATE 01 — TITLE SCREEN (dynamic) -->
  <section class="screen" id="screen-titlescreen">
    <p class="text-subtitle titlescreen-numero" id="ts-numero"></p>
    <div class="titlescreen-middle">
      <img class="sticker sticker-left"  id="ts-sticker-l" src="" alt="">
      <h1 class="text-major" id="ts-intitule"></h1>
      <img class="sticker sticker-right" id="ts-sticker-r" src="" alt="">
    </div>
    <button class="btn-large" id="btn-titlescreen"></button>
  </section>

  <!-- TEMPLATE 02 — QCM (dynamic) -->
  <section class="screen" id="screen-qcm">
    <p class="text-subtitle qcm-numero" id="qcm-numero">QUESTION 1</p>
    <p class="text-question qcm-question-text" id="qcm-text"></p>
    <div class="qcm-grid">
      <div class="qcm-box-wrapper">
        <div class="qcm-checkbox"><span class="qcm-checkbox-icon"></span></div>
        <div class="qcm-box" data-pos="1">
          <div class="qcm-box-inner">
            <img class="qcm-bubble-img" src="/public/images/bulleBackground.svg" alt="">
            <span class="qcm-answer-text"></span>
          </div>
        </div>
      </div>
      <div class="qcm-box-wrapper">
        <div class="qcm-checkbox"><span class="qcm-checkbox-icon"></span></div>
        <div class="qcm-box" data-pos="2">
          <div class="qcm-box-inner">
            <img class="qcm-bubble-img" src="/public/images/bulleBackground.svg" alt="">
            <span class="qcm-answer-text"></span>
          </div>
        </div>
      </div>
      <div class="qcm-box-wrapper">
        <div class="qcm-checkbox"><span class="qcm-checkbox-icon"></span></div>
        <div class="qcm-box" data-pos="3">
          <div class="qcm-box-inner">
            <img class="qcm-bubble-img" src="/public/images/bulleBackground.svg" alt="">
            <span class="qcm-answer-text"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="qcm-next-wrap" id="qcm-next-wrap" style="display:none">
      <button class="btn-small" id="btn-qcm-next">SUIVANT</button>
    </div>
  </section>

  <!-- COMBINED QCM SCORE SCREEN -->
  <section class="screen" id="screen-qcm-score">
    <span class="score-badge">FIN DE LA PHASE 1</span>
    <h1 class="score-title">SCORES</h1>
    <div class="score-row">
      <div class="score-card" id="qcm-score-david-card">
        <span class="score-card__leader" id="qcm-score-david-leader">EN TÊTE</span>
        <p class="score-card__name">DAVID</p>
        <p class="score-card__value" id="qcm-score-david-val">0</p>
        <p class="score-card__unit">/ 5 BONNES RÉPONSES</p>
      </div>
      <div class="score-vs">
        <span class="score-vs__text">VS</span>
      </div>
      <div class="score-card" id="qcm-score-juliette-card">
        <span class="score-card__leader" id="qcm-score-juliette-leader">EN TÊTE</span>
        <p class="score-card__name">JULIETTE</p>
        <p class="score-card__value" id="qcm-score-juliette-val">0</p>
        <p class="score-card__unit">/ 5 BONNES RÉPONSES</p>
      </div>
    </div>
    <button class="btn-large" id="btn-qcm-score-next">LA FINALE</button>
  </section>

  <!-- TEMPLATE 03 — FINALE (dynamic) -->
  <section class="screen" id="screen-finale">
    <div class="finale-left">
      <p class="finale-question-label" id="finale-question"></p>
      <div>
        <p class="finale-answer-label">RÉPONSE ATTENDUE</p>
        <p class="finale-answer-value" id="finale-answer"></p>
      </div>
      <div class="finale-actions">
        <button class="btn-action btn-success" id="btn-finale-success">
          RÉUSSI <span class="btn-icon btn-icon-check"></span>
        </button>
        <button class="btn-action btn-failure" id="btn-finale-failure">
          RATÉ <span class="btn-icon btn-icon-close"></span>
        </button>
      </div>
      <button class="btn-small" id="btn-finale-next" style="display:none; margin-top:32px">QUESTION SUIVANTE</button>
    </div>

    <div class="finale-right">
      <div class="finale-timer" id="finale-timer">10</div>
      <p class="finale-counter" id="finale-counter">1 / 15</p>
      <div class="hearts-container">
        <div class="hearts-col" id="hearts-col-0">
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
        </div>
        <div class="hearts-col hearts-col-mid" id="hearts-col-1">
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
        </div>
        <div class="hearts-col" id="hearts-col-2">
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
          <div class="heart-icon state-idle"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- FINAL SCORE SCREEN -->
  <section class="screen" id="screen-finalscore">
    <span class="score-badge">FIN DU JEU</span>
    <h1 class="score-title">RÉSULTAT FINAL</h1>
    <div class="score-row">
      <div class="score-card score-card--final" id="final-david-card">
        <span class="score-card__leader" id="final-david-leader">🏆</span>
        <p class="score-card__name">DAVID</p>
        <div class="score-card__breakdown">
          <p>Phase 1 &nbsp;<span id="final-david-qcm" class="score-card__sub">0</span><span class="score-card__sub-unit">/5</span></p>
          <p>Finale &nbsp;&nbsp;&nbsp;<span id="final-david-finale" class="score-card__sub">0</span><span class="score-card__sub-unit">/15</span></p>
        </div>
        <p class="score-card__value" id="final-david-total">0</p>
        <p class="score-card__unit">/ 20</p>
      </div>
      <div class="score-vs">
        <span class="score-vs__text">VS</span>
      </div>
      <div class="score-card score-card--final" id="final-juliette-card">
        <span class="score-card__leader" id="final-juliette-leader">🏆</span>
        <p class="score-card__name">JULIETTE</p>
        <div class="score-card__breakdown">
          <p>Phase 1 &nbsp;<span id="final-juliette-qcm" class="score-card__sub">0</span><span class="score-card__sub-unit">/5</span></p>
          <p>Finale &nbsp;&nbsp;&nbsp;<span id="final-juliette-finale" class="score-card__sub">0</span><span class="score-card__sub-unit">/15</span></p>
        </div>
        <p class="score-card__value" id="final-juliette-total">0</p>
        <p class="score-card__unit">/ 20</p>
      </div>
    </div>
    <p class="score-winner-text" id="final-winner-text"></p>
    <button class="btn-large" id="btn-finalscore-replay">REJOUER</button>
  </section>

</div><!-- #app -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
<script src="/js/main.js"></script>
</body>
</html>
